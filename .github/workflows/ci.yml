name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Builds never run queries: the pool initializes lazily. The URL is a
          # placeholder for the import-time wiring (auth adapter); production
          # builds of this repo never need the real database.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          DATABASE_URL: postgresql://build:build@localhost:5432/flippeak
